<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="robots" content="noindex" />
  <title>Painel · Pastora Simone</title>
  <meta name="theme-color" content="#a8740f" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Pastora Simone" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <link href="https://fonts.googleapis.com/css2?family=Poiret+One&family=Jost:wght@300;400;500;600&family=Cormorant+Garamond:ital,wght@0,500;1,500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="stylesheet" href="css/plataforma.css" />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/evento.css" />
</head>
<body>
  <div class="tela-carregando" id="carregando"><div class="spinner"></div>Verificando acesso...</div>

  <div class="app">
    <header class="topbar-mobile">
      <button class="icon-btn" id="btnMenu" aria-label="Abrir menu"><i class="fa-solid fa-bars"></i></button>
      <div class="logo"><img src="img/logo-simone.png" alt="" /><span><b>Pastora Simone</b><small>Painel</small></span></div>
    </header>
    <div class="menu-overlay" id="menuOverlay"></div>
    <aside class="sidebar">
      <div class="logo"><img src="img/logo-simone.png" alt="" /><span><b>Pastora Simone</b><small>Escola Bíblica</small></span></div>
      <div class="role">PAINEL DA PASTORA</div>
      <nav class="side-nav" id="adminNav">
        <button data-page="dashboard" class="active"><i class="fa-solid fa-gauge"></i> Dashboard</button>
        <button data-page="aulas"><i class="fa-solid fa-circle-play"></i> Aulas</button>
        <button data-page="alunos"><i class="fa-solid fa-users"></i> Alunos</button>
        <button data-page="materiais"><i class="fa-solid fa-folder-open"></i> Materiais</button>
        <button data-page="eventos"><i class="fa-solid fa-calendar-days"></i> Eventos</button>
        <button data-page="gestao"><i class="fa-solid fa-list-check"></i> Gestão</button>
        <button data-page="financeiro"><i class="fa-solid fa-sack-dollar"></i> Financeiro</button>
        <button data-page="config"><i class="fa-solid fa-gear"></i> Configurações</button>
      </nav>
      <div class="side-user">
        <div class="avatar">PS</div>
        <div class="info"><strong>Pastora Simone</strong><small id="adminEmail"></small></div>
        <button class="icon-btn" id="btnSair" title="Sair" aria-label="Sair"><i class="fa-solid fa-right-from-bracket"></i></button>
      </div>
    </aside>
    <main class="main" id="adminMain"></main>
  </div>

  <!-- Modal de formulários -->
  <div class="modal" id="formModal">
    <div class="modal-overlay" data-close-modal></div>
    <div class="modal-content wide">
      <button class="icon-btn modal-close" data-close-modal aria-label="Fechar"><i class="fa-solid fa-xmark"></i></button>
      <div id="formModalBody"></div>
    </div>
  </div>

  <!-- Modal para assistir a aula -->
  <div class="modal" id="playerModal">
    <div class="modal-overlay" data-close-modal></div>
    <div class="modal-content video">
      <button class="icon-btn modal-close" data-close-modal aria-label="Fechar"><i class="fa-solid fa-xmark"></i></button>
      <div class="player-frame" id="playerFrame"></div>
      <div class="player-info"><div><span class="eyebrow" id="playerModulo"></span><h3 id="playerTitulo"></h3><p id="playerDesc"></p></div></div>
    </div>
  </div>

  <script type="module" src="js/admin.js"></script>
</body>
</html>
